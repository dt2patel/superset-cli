[project]
name = "tathya-cli"
version = "0.1.0"
description = "Safe CLI bridge between AI agents and the Tathya (Apache Superset 4.0) instance"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "sqlglot>=25.0",
    "PyYAML>=6.0",
    "croniter>=6.2.4",
]

[project.scripts]
tathya = "tathya.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tathya"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
